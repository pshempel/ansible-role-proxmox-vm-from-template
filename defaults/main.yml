---
# defaults/main.yml for ansible-role-proxmox-vm-from-template
#
# Variable Naming Conventions:
# - pvmt_* : All role configuration variables use this prefix (Proxmox VM Template)
#           This prevents conflicts with other roles and Ansible built-ins
# - proxmox_api_* : API connection variables (kept for compatibility, should be api_*)
# - No prefix : Runtime/internal variables created with set_fact during execution
# - vm_* : Per-VM runtime variables (e.g., vm_selected_template_vmid)
#
# Variable Override Hierarchy:
# 1. Per-VM settings in 'vms' list (highest priority)
#    Example: vms[0].memory, vms[0].vm_start_now
# 2. Playbook-level pvmt_default_* overrides
#    Example: Set pvmt_default_vm_start_now: "yes" to change default for all VMs
# 3. Role defaults in this file (lowest priority)
#
# Per-VM Variable Names:
# When setting values for individual VMs, use the short form without pvmt_default_ prefix:
#   - memory (not pvmt_default_memory_size)
#   - disk_size (not pvmt_default_disk_size)
#   - vm_start_now (not pvmt_default_vm_start_now)
#   - boot_on_start (not pvmt_default_boot_on_start)
#   - vm_agent (not pvmt_default_vm_agent)
#   - cores (not pvmt_default_cpu_cores)
#   - sockets (not pvmt_default_cpu_sockets)
#   - disk (not pvmt_default_vm_disk) - to specify disk device manually
#
# Disk Device Auto-Discovery:
# The role automatically discovers disk devices from cloned VMs to handle different
# template configurations (scsi0, virtio0, ide0, sata0, etc.).
# - Auto-discovery runs when disk resize is needed and no explicit disk is specified
# - Discovers the primary disk device and its storage location from VM config
# - Falls back to pvmt_default_vm_disk if discovery fails
# - Override by setting 'disk: virtio0' in per-VM config
#
# Default VM configurations
pvmt_default_memory_size: 2048         # MB
pvmt_default_vm_balloon: "{{ vm_to_clone.memory | default(pvmt_default_memory_size) }}"  # set min memory for ballooning
pvmt_default_disk_size: "30G"          # Disk size
pvmt_default_cpu_sockets: 1            # Number of CPU sockets
pvmt_default_cpu_cores: 2              # Number of per CPU cores
pvmt_default_template_tag: "bookworm"  # Default VM template tag
pvmt_default_proxmox_pool: "Virtual_Machines"  # Default pool for VMs. Set to an empty string or omit for no default pool
pvmt_default_vm_disk: "scsi0"           # Default disk (fallback if auto-discovery fails)
pvmt_default_vm_agent: "yes"            # Enable agent on vm
pvmt_default_boot_on_start: true        # Boot VM on start of Proxmox
pvmt_default_vm_start_now: "no"
pvmt_default_validate_certs: "true"
pvmt_default_proxmox_api_timeout: 120  # Defaults to 360 seconds if not set
pvmt_default_vm_network_vlan: 0        # Default VLAN tag # Zero is empty
pvmt_default_domain_name: "your-default-doman.com"
pvmt_default_proxmox_bridge: "vmbr0"
pvmt_preferred_storage_type: 'zfs'  # Preferred storage type, e.g., 'zfs', 'lvm', 'iscsi'
# Settings for cloud-init
pvmt_default_cloudinit_ipv4: "dhcp"       # Default IPv4 setting
pvmt_default_cloudinit_ipv6: "dhcp"       # Default IPv6 setting
pvmt_default_node: "pve4"       # Default Proxmox node (currently unused - role auto-selects based on memory)
# This is the path on the cluster local system
pvmt_include_custom_cloud_init: true      # This set to now will ignore all other cloud init settings
pvmt_local_node_cloud_init_path: "/path/to/local/cloud_init_files/"
pvmt_cloud_init_proxmox_storage_path: "local:snippets/"
pvmt_cloud_init_config_behavior: "append"  # Options: "append", "replace"
pvmt_skip_package_check: false              # whether to skip local package install on run or not
pvmt_debug_mode_enable: false
# You must put these two lines below in your playbook
# The settings can be included using vars_files
# Be sure that you use quotes in your placement
proxmox_api_url: "https://your-proxmoxurl.com:8006/api2/json"   # Proxmox API URL
proxmox_api_host: "your-proxmoxurl.com:8006"                    # do not include https or http
# API authentication - these MUST be provided by the user
# proxmox_api_token_id: "user@realm!tokenname"  # Example: root@pam!ansible
# proxmox_api_token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # Token secret
