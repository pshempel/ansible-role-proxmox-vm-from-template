---
# Start the VM if pvmt_default_vm_start_now is set to yes
- name: Debug VM start decision
  ansible.builtin.debug:
    msg: |
      VM: {{ vm_data_to_clone.name }}
      Start VM decision: {{ (vm_data_to_clone.vm_start_now | default(pvmt_default_vm_start_now)) }}
      Value source: {{ 'vm_start_now from VM config' if vm_data_to_clone.vm_start_now is defined else 'pvmt_default_vm_start_now (default)' }}
      Will start: {{ (vm_data_to_clone.vm_start_now | default(pvmt_default_vm_start_now)) | bool }}
  when: pvmt_debug_mode_enable | default(false) | bool

- name: Start VM and verify state
  when: (vm_data_to_clone.vm_start_now | default(pvmt_default_vm_start_now)) | bool
  block:
    - name: Start VM
      community.general.proxmox_kvm:
        api_user: "{{ proxmox_api_token_id.split('!')[0] }}"
        api_token_id: "{{ proxmox_api_token_id.split('!')[1] }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        api_host: "{{ proxmox_api_host }}"
        node: "{{ vm_target_node }}"
        vmid: "{{ clone_results.vmid }}"
        state: started

    # Check the VM state
    - name: Start VM
      community.general.proxmox_kvm:
        api_user: "{{ proxmox_api_token_id.split('!')[0] }}"
        api_token_id: "{{ proxmox_api_token_id.split('!')[1] }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        api_host: "{{ proxmox_api_host }}"
        node: "{{ vm_target_node }}"
        vmid: "{{ clone_results.vmid }}"
        state: current
      register: state

    - name: Debug vm state
      ansible.builtin.debug:
        var: state
